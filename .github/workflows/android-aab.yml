name: Build Android AAB
# Build verification trigger

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-aab.yml"
      - "mqys-lmtr-lmrbaa-llGrf.zip"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract web application
        run: |
          rm -rf web extracted
          mkdir -p web extracted
          unzip -q mqys-lmtr-lmrbaa-llGrf.zip -d extracted
          INDEX="$(find extracted -type f -name index.html | head -n 1)"
          if [ -z "$INDEX" ]; then
            echo "index.html was not found in the supplied ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          ROOT="$(dirname "$INDEX")"
          cp -a "$ROOT"/. web/
          test -f web/index.html

      - name: Create Capacitor Android wrapper
        run: |
          cat > package.json <<'EOF'
          {
            "name": "room-area-calculator-android",
            "private": true,
            "scripts": {
              "cap:add": "cap add android",
              "cap:sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "typescript": "^5.9.2"
            }
          }
          EOF

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.aljalal.roommeasure',
            appName: 'مقياس المتر المربع للغرف',
            webDir: 'web',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          npm install
          npx cap add android

      - name: Configure Android SDK targets and camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/variables.gradle")
          if p.exists():
              s=p.read_text()
              import re
              s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
              s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
              s=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 23', s)
              p.write_text(s)
          import xml.etree.ElementTree as ET
          m=Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree=ET.parse(m)
          root=tree.getroot()
          camera="{http://schemas.android.com/apk/res/android}name"
          if not any(p.get(camera) == "android.permission.CAMERA" for p in root.findall("uses-permission")):
              ET.SubElement(root, "uses-permission", {camera: "android.permission.CAMERA"})
          tree.write(m, encoding="utf-8", xml_declaration=True)
          PY
          npx cap sync android

      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB
        run: |
          ls -lh android/app/build/outputs/bundle/release/*.aab
          test -s android/app/build/outputs/bundle/release/*.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-area-calculator-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
